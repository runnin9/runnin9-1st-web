<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Runnin9">
    <meta name="theme-color" content="#1a1b2e">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <title>Runnin9 - 달리기 게임</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%;
            overflow: hidden; background: #1a1b2e;
            touch-action: none; overscroll-behavior: none;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        canvas { display: block; }
        #safe { position: absolute; top: 0; left: 0; width: 0; height: 0; padding-top: env(safe-area-inset-top, 0px); visibility: hidden; }
    </style>
</head>
<body>
<div id="safe"></div>
<canvas id="game"></canvas>
<script>
(() => {
'use strict';

// ---------- 기본 설정 ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const safeEl = document.getElementById('safe');

const BASE = 360;          // 논리 좌표계 기준 크기 (짧은 변)
const GRAVITY = 0.62;      // 프레임당 중력 가속도
const JUMP = 11.2;         // 점프 초기 속도
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif';

let W = BASE, H = BASE, scale = 1, dpr = 1, GROUND = 300, safeTop = 0;

function loadBest() {
    try { return Number(localStorage.getItem('runnin9_best')) || 0; } catch (e) { return 0; }
}
function saveBest(v) {
    try { localStorage.setItem('runnin9_best', String(v)); } catch (e) { /* 사생활 보호 모드 등 */ }
}

const G = {
    state: 'title',        // title | play | pause | over
    speed: 5, dist: 0, score: 0, frame: 0, overAt: 0, spawnDist: 320,
    best: loadBest(), newBest: false, flash: 0, flashText: '',
    obstacles: [], clouds: [], stars: [], mountains: []
};
const P = { x: 60, y: 0, w: 26, h: 40, vy: 0, onGround: true, jumps: 0 };

// 배경 요소 초기화
for (let i = 0; i < 7; i++) {
    G.clouds.push({ x: Math.random() * BASE * 2.2, yf: Math.random(), s: 0.6 + Math.random() * 0.8, v: 0.12 + Math.random() * 0.18 });
}
for (let i = 0; i < 45; i++) {
    G.stars.push({ xf: Math.random(), yf: Math.random(), r: 0.6 + Math.random() * 1.2 });
}
for (let i = 0; i < 48; i++) {
    G.mountains.push(0.2 + Math.random() * 0.8);
}

// ---------- 화면 크기 ----------
function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = window.innerWidth, ch = window.innerHeight;
    if (cw < ch) { W = BASE; H = BASE * ch / cw; }      // 세로 화면
    else         { H = BASE; W = BASE * cw / ch; }      // 가로 화면
    scale = cw / W;
    canvas.width = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    GROUND = H - Math.max(56, H * 0.13);
    safeTop = (parseFloat(getComputedStyle(safeEl).paddingTop) || 0) / scale;
    if (P.onGround) P.y = GROUND - P.h;
    for (const o of G.obstacles) {
        if (o.type === 'cactus') o.y = GROUND - o.h;
        else o.baseY = GROUND - o.up;
    }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 100));
resize();

// ---------- 사운드 ----------
let actx = null;
function ensureAudio() {
    try {
        if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
        if (actx.state === 'suspended') actx.resume();
    } catch (e) { /* 오디오 미지원 */ }
}
function tone(f0, f1, dur, type, vol) {
    if (!actx) return;
    try {
        const t = actx.currentTime;
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, t);
        o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + dur);
    } catch (e) { /* 무시 */ }
}
function sfx(name) {
    if (name === 'jump') tone(300, 700, 0.12, 'square', 0.06);
    else if (name === 'jump2') tone(500, 950, 0.1, 'square', 0.05);
    else if (name === 'die') tone(320, 60, 0.45, 'sawtooth', 0.08);
    else if (name === 'milestone') {
        tone(880, 880, 0.08, 'triangle', 0.06);
        setTimeout(() => tone(1320, 1320, 0.14, 'triangle', 0.06), 90);
    }
}

// ---------- 게임 흐름 ----------
function start() {
    G.state = 'play';
    G.speed = 5; G.dist = 0; G.score = 0;
    G.obstacles = []; G.spawnDist = 320;
    G.newBest = false; G.flash = 0;
    P.y = GROUND - P.h; P.vy = 0; P.onGround = true; P.jumps = 0;
}

function die(now) {
    G.state = 'over';
    G.overAt = now;
    G.newBest = G.score > G.best;
    if (G.newBest) { G.best = G.score; saveBest(G.best); }
    sfx('die');
    if (navigator.vibrate) { try { navigator.vibrate([80, 40, 120]); } catch (e) {} }
}

function spawn() {
    const diff = Math.min(1, G.dist / 10000);   // 0 → 1 로 갈수록 어려움
    const r = Math.random();
    let o;
    if (G.dist > 800 && r < 0.2 + diff * 0.2) {
        // 새: 점프하지 말고 아래로 지나가야 함
        const up = 78 + Math.random() * 30;
        o = { type: 'bird', x: W + 30, w: 34, h: 20, up, baseY: GROUND - up, y: GROUND - up, phase: Math.random() * 6.28 };
    } else if (G.dist > 2000 && r < 0.5) {
        // 선인장 두 개
        const h = 30 + Math.random() * 18;
        o = { type: 'cactus', x: W + 30, w: 46, h, y: GROUND - h, count: 2 };
    } else {
        const h = 28 + Math.random() * 26;
        const w = 16 + Math.random() * 12;
        o = { type: 'cactus', x: W + 30, w, h, y: GROUND - h, count: 1 };
    }
    G.obstacles.push(o);
    G.spawnDist = G.speed * (48 + Math.random() * 40) * (1 - diff * 0.15);
}

function hit(a, b) {
    const m = 5; // 판정 여유
    return a.x + m < b.x + b.w - m && a.x + a.w - m > b.x + m &&
           a.y + m < b.y + b.h - m && a.y + a.h - m > b.y + m;
}

function update(dt, now) {
    G.frame += dt;
    const bgSpeed = G.state === 'play' ? G.speed : 1.5;
    for (const c of G.clouds) {
        c.x -= bgSpeed * c.v * dt;
        if (c.x < -100) c.x = W + 40 + Math.random() * 120;
    }
    if (G.flash > 0) G.flash -= dt;
    if (G.state !== 'play') return;

    G.speed = Math.min(13, 5 + G.dist / 1800);
    G.dist += G.speed * dt;
    const s = Math.floor(G.dist / 10);
    if (Math.floor(s / 100) > Math.floor(G.score / 100)) {
        G.flash = 45;
        G.flashText = (Math.floor(s / 100) * 100) + '점 돌파!';
        sfx('milestone');
    }
    G.score = s;

    // 플레이어 물리
    P.vy += GRAVITY * dt;
    P.y += P.vy * dt;
    const floor = GROUND - P.h;
    if (P.y >= floor) {
        P.y = floor; P.vy = 0;
        if (!P.onGround) { P.onGround = true; P.jumps = 0; }
    }

    // 장애물 생성/이동/충돌
    G.spawnDist -= G.speed * dt;
    if (G.spawnDist <= 0) spawn();
    for (const o of G.obstacles) {
        o.x -= (G.speed + (o.type === 'bird' ? 1.5 : 0)) * dt;
        if (o.type === 'bird') o.y = o.baseY + Math.sin(G.frame * 0.12 + o.phase) * 5;
        if (hit(P, o)) { die(now); return; }
    }
    G.obstacles = G.obstacles.filter(o => o.x + o.w > -20);
}

// ---------- 입력 ----------
function onTap(now) {
    ensureAudio();
    if (G.state === 'title') { start(); return; }
    if (G.state === 'pause') { G.state = 'play'; last = performance.now(); return; }
    if (G.state === 'over') { if (now - G.overAt > 700) start(); return; }
    if (P.onGround) {
        P.vy = -JUMP; P.onGround = false; P.jumps = 1; sfx('jump');
    } else if (P.jumps < 2) {
        P.vy = -JUMP * 0.92; P.jumps = 2; sfx('jump2');
    }
}
canvas.addEventListener('pointerdown', e => { e.preventDefault(); onTap(performance.now()); });
window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        if (!e.repeat) onTap(performance.now());
    }
});
document.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (G.state === 'play') G.state = 'pause'; }
    else last = performance.now();
});

// ---------- 그리기 도우미 ----------
function lerp(a, b, t) { return a + (b - a) * t; }
function mix(c1, c2, t) {
    return 'rgb(' + Math.round(lerp(c1[0], c2[0], t)) + ',' + Math.round(lerp(c1[1], c2[1], t)) + ',' + Math.round(lerp(c1[2], c2[2], t)) + ')';
}
function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}
function text(str, x, y, size, color, align, weight) {
    ctx.font = (weight || 'bold') + ' ' + size + 'px ' + FONT;
    ctx.fillStyle = color;
    ctx.textAlign = align || 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
}

function drawMountains(offset, amp, color) {
    const step = 48, n = G.mountains.length;
    const startIdx = Math.floor(offset / step);
    const frac = offset % step;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-step, GROUND);
    for (let i = -1; i <= W / step + 2; i++) {
        const idx = ((startIdx + i) % n + n) % n;
        ctx.lineTo(i * step - frac, GROUND - G.mountains[idx] * amp);
    }
    ctx.lineTo(W + step * 2, GROUND);
    ctx.closePath();
    ctx.fill();
}

function drawCloud(x, y, s, a) {
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    ctx.beginPath();
    ctx.arc(x, y, 14 * s, 0, 7);
    ctx.arc(x + 16 * s, y - 8 * s, 18 * s, 0, 7);
    ctx.arc(x + 34 * s, y, 14 * s, 0, 7);
    ctx.rect(x, y, 34 * s, 14 * s);
    ctx.fill();
}

function drawCactus(x, y, w, h) {
    ctx.fillStyle = '#2f9e5b';
    const cw = w * 0.42;
    rr(x + (w - cw) / 2, y, cw, h + 4, 5); ctx.fill();
    if (h > 34) {
        // 왼팔
        rr(x, y + h * 0.28, w * 0.14, h * 0.32, 3); ctx.fill();
        rr(x, y + h * 0.5, (w - cw) / 2 + 2, h * 0.13, 3); ctx.fill();
        // 오른팔
        rr(x + w - w * 0.14, y + h * 0.18, w * 0.14, h * 0.32, 3); ctx.fill();
        rr(x + w / 2 + cw / 2 - 2, y + h * 0.4, (w - cw) / 2 + 2, h * 0.13, 3); ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let yy = y + 8; yy < y + h - 4; yy += 9) {
        ctx.fillRect(x + w / 2 - 1, yy, 2, 3);
    }
}

function drawBird(o) {
    const flap = Math.sin(G.frame * 0.35 + o.phase);
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
    ctx.save();
    ctx.translate(cx, cy);
    // 날개
    ctx.fillStyle = '#7b4dff';
    ctx.beginPath();
    ctx.moveTo(-4, 0); ctx.lineTo(-14, -6 - flap * 10); ctx.lineTo(4, -2); ctx.closePath(); ctx.fill();
    // 몸통
    ctx.fillStyle = '#9b6bff';
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 8, 0, 0, 7); ctx.fill();
    // 부리
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.moveTo(-14, -1); ctx.lineTo(-21, 1); ctx.lineTo(-14, 3); ctx.closePath(); ctx.fill();
    // 눈
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-8, -2, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-9, -2, 1.5, 0, 7); ctx.fill();
    // 꼬리
    ctx.fillStyle = '#7b4dff';
    ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(20, -6); ctx.lineTo(19, 3); ctx.closePath(); ctx.fill();
    ctx.restore();
}

function drawPlayer() {
    const { x, y, w, h } = P;
    const dead = G.state === 'over';
    const running = P.onGround && G.state === 'play';
    const t = G.frame * 0.38;
    const legA = running ? Math.sin(t) * 9 : (P.onGround ? 0 : 6);
    const bob = running ? Math.abs(Math.sin(t)) * 2 : 0;
    const airTilt = !P.onGround && !dead ? Math.max(-0.25, Math.min(0.25, P.vy * 0.03)) : 0;

    // 그림자
    const alt = (GROUND - (y + h)) / 120;
    ctx.fillStyle = 'rgba(0,0,0,' + Math.max(0.05, 0.25 - alt * 0.2) + ')';
    ctx.beginPath(); ctx.ellipse(x + w / 2, GROUND + 3, w * 0.7 * (1 - alt * 0.4), 4, 0, 0, 7); ctx.fill();

    ctx.save();
    ctx.translate(x + w / 2, y - bob + h / 2);
    ctx.rotate(airTilt);
    ctx.translate(-w / 2, -h / 2);
    // 다리
    ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(w * 0.35, h - 12); ctx.lineTo(w * 0.35 - legA, h);
    ctx.moveTo(w * 0.65, h - 12); ctx.lineTo(w * 0.65 + legA, h);
    ctx.stroke();
    // 몸
    ctx.fillStyle = '#ff7a45'; rr(2, 12, w - 4, h - 24, 7); ctx.fill();
    // 팔
    ctx.strokeStyle = '#ff7a45'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(w - 4, 18); ctx.lineTo(w + 4 - (running ? legA * 0.5 : -4), 26 - (P.onGround ? 0 : 10)); ctx.stroke();
    // 스카프
    ctx.fillStyle = '#ffd95c'; rr(0, 17, w, 5, 2); ctx.fill();
    // 머리
    ctx.fillStyle = '#ffd9b3'; ctx.beginPath(); ctx.arc(w / 2, 9, 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#2b2d42'; ctx.beginPath(); ctx.arc(w / 2, 8, 10, Math.PI, Math.PI * 2); ctx.fill();
    // 눈
    if (dead) {
        ctx.strokeStyle = '#2b2d42'; ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(w / 2 + 3, 8); ctx.lineTo(w / 2 + 9, 14);
        ctx.moveTo(w / 2 + 9, 8); ctx.lineTo(w / 2 + 3, 14);
        ctx.stroke();
    } else {
        ctx.fillStyle = '#2b2d42'; ctx.beginPath(); ctx.arc(w / 2 + 5, 11, 2.2, 0, 7); ctx.fill();
    }
    ctx.restore();
}

function drawPanel(cx, cy, pw, ph) {
    ctx.fillStyle = 'rgba(20, 22, 48, 0.78)';
    rr(cx - pw / 2, cy - ph / 2, pw, ph, 18); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
}

// ---------- 그리기 ----------
function draw(now) {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    const cycle = (G.dist / 9000) % 1;
    const night = 0.5 - 0.5 * Math.cos(cycle * Math.PI * 2);   // 0 낮 → 1 밤

    // 하늘
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, mix([92, 172, 255], [8, 12, 40], night));
    sky.addColorStop(1, mix([212, 236, 255], [52, 42, 92], night));
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // 별
    if (night > 0.3) {
        ctx.fillStyle = 'rgba(255,255,255,' + ((night - 0.3) / 0.7).toFixed(2) + ')';
        for (const s of G.stars) {
            ctx.beginPath(); ctx.arc(s.xf * W, safeTop + s.yf * GROUND * 0.65, s.r, 0, 7); ctx.fill();
        }
    }
    // 해 / 달
    ctx.fillStyle = mix([255, 217, 92], [240, 240, 220], night);
    ctx.beginPath(); ctx.arc(W * 0.8, safeTop + 64, 22, 0, 7); ctx.fill();
    if (night > 0.5) {
        ctx.fillStyle = mix([92, 172, 255], [8, 12, 40], night);
        ctx.beginPath(); ctx.arc(W * 0.8 + 9, safeTop + 58, 18, 0, 7); ctx.fill();
    }

    // 구름
    const cloudA = lerp(0.9, 0.3, night);
    for (const c of G.clouds) drawCloud(c.x, safeTop + 30 + c.yf * GROUND * 0.4, c.s, cloudA);

    // 산
    drawMountains(G.dist * 0.2, 90, mix([140, 175, 215], [28, 30, 72], night));
    drawMountains(G.dist * 0.45, 50, mix([84, 140, 118], [22, 44, 56], night));

    // 땅
    ctx.fillStyle = mix([112, 190, 92], [32, 74, 54], night);
    ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = mix([154, 112, 72], [52, 42, 44], night);
    ctx.fillRect(0, GROUND + 10, W, H - GROUND - 10);
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
    const off = G.dist % 60;
    ctx.beginPath();
    for (let x = -off; x < W; x += 60) { ctx.moveTo(x, GROUND + 24); ctx.lineTo(x + 24, GROUND + 24); }
    for (let x = -off + 30; x < W; x += 60) { ctx.moveTo(x, GROUND + 38); ctx.lineTo(x + 14, GROUND + 38); }
    ctx.stroke();

    // 장애물
    for (const o of G.obstacles) {
        if (o.type === 'bird') drawBird(o);
        else if (o.count === 2) { drawCactus(o.x, o.y, o.w / 2 - 2, o.h); drawCactus(o.x + o.w / 2 + 2, o.y + 4, o.w / 2 - 2, o.h - 4); }
        else drawCactus(o.x, o.y, o.w, o.h);
    }

    drawPlayer();

    // HUD
    const hudY = safeTop + 22;
    const hudColor = night > 0.5 ? '#ffffff' : '#1a1b2e';
    text('최고 ' + G.best, 14, hudY, 15, hudColor, 'left');
    text(String(G.score).padStart(5, '0'), W - 14, hudY, 24, hudColor, 'right');
    if (G.state === 'play' && G.flash > 0) {
        const a = Math.min(1, G.flash / 15);
        text(G.flashText, W / 2, safeTop + 60, 20, 'rgba(255,122,69,' + a.toFixed(2) + ')');
    }

    // 오버레이
    const cy = GROUND * 0.45;
    const pw = Math.min(W - 40, 320);
    const blink = (Math.sin(now / 300) + 1) / 2 * 0.6 + 0.4;
    if (G.state === 'title') {
        drawPanel(W / 2, cy, pw, 230);
        text('RUNNIN9', W / 2, cy - 72, 42, '#ffd95c');
        text('무한 달리기', W / 2, cy - 40, 15, '#ffffff', 'center', 'normal');
        text('화면 탭: 점프', W / 2, cy - 4, 14, '#dfe3ff', 'center', 'normal');
        text('공중에서 한 번 더 탭: 2단 점프', W / 2, cy + 18, 14, '#dfe3ff', 'center', 'normal');
        text('새는 점프하지 말고 아래로 지나가세요', W / 2, cy + 40, 14, '#dfe3ff', 'center', 'normal');
        text('화면을 탭해서 시작', W / 2, cy + 82, 17, 'rgba(255,255,255,' + blink.toFixed(2) + ')');
    } else if (G.state === 'over') {
        drawPanel(W / 2, cy, pw, 210);
        text('게임 오버', W / 2, cy - 68, 34, '#ff7a45');
        text('점수  ' + G.score, W / 2, cy - 22, 22, '#ffffff');
        text('최고  ' + G.best, W / 2, cy + 10, 16, '#dfe3ff', 'center', 'normal');
        if (G.newBest) text('🎉 신기록!', W / 2, cy + 38, 16, '#ffd95c');
        if (now - G.overAt > 700) text('탭해서 다시 시작', W / 2, cy + 74, 17, 'rgba(255,255,255,' + blink.toFixed(2) + ')');
    } else if (G.state === 'pause') {
        drawPanel(W / 2, cy, pw, 120);
        text('일시정지', W / 2, cy - 20, 28, '#ffffff');
        text('탭해서 계속', W / 2, cy + 28, 16, 'rgba(255,255,255,' + blink.toFixed(2) + ')');
    }
}

// ---------- 메인 루프 ----------
let last = performance.now();
function loop(now) {
    let dt = (now - last) / (1000 / 60);
    last = now;
    if (dt > 3) dt = 3;
    if (dt < 0) dt = 0;
    update(dt, now);
    draw(now);
