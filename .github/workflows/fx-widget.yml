# 원→달러 안드로이드 위젯 앱(fx-widget/) APK 빌드.
# main 에 올라가면 'fx-widget-latest' 릴리스에 APK 를 올려서 휴대폰에서 바로 받을 수 있게 합니다.
name: fx-widget APK

on:
  push:
    paths:
      - 'fx-widget/**'
      - '.github/workflows/fx-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fx-widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk fx-widget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fx-widget-apk
          path: fx-widget/fx-widget.apk

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fx-widget-latest --yes --cleanup-tag || true
          gh release create fx-widget-latest fx-widget.apk \
            --title "원→달러 위젯 앱 (최신)" \
            --notes "안드로이드 휴대폰에서 fx-widget.apk 를 눌러 받은 뒤 설치하세요. 커밋: ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
