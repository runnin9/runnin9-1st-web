# 원→달러 안드로이드 위젯 앱(fx-widget/) APK 빌드.
# main 에 올라가면 'fx-widget-latest' 릴리스에 APK 를 올려서 휴대폰에서 바로 받을 수 있게 합니다.
name: fx-widget APK

on:
  push:
    paths:
      - 'fx-widget/**'
      - '.github/workflows/fx-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fx-widget
    env:
      # 고정 서명 키 (저장소 Settings → Secrets and variables → Actions 에 등록)
      FX_KEYSTORE_B64: ${{ secrets.FX_KEYSTORE_B64 }}
      FX_KEYSTORE_PASSWORD: ${{ secrets.FX_KEYSTORE_PASSWORD }}
      FX_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK
        run: |
          if [ -n "$FX_KEYSTORE_B64" ]; then
            echo "$FX_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fx.jks"
            export FX_KEYSTORE_FILE="$RUNNER_TEMP/fx.jks"
            echo "고정 서명 키로 서명합니다."
          else
            echo "::warning::FX_KEYSTORE_B64 시크릿이 없어 디버그 키로 서명합니다 (업데이트 시 재설치 필요)."
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk fx-widget.apk
          rm -f "$RUNNER_TEMP/fx.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: fx-widget-apk
          path: fx-widget/fx-widget.apk

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete fx-widget-latest --yes --cleanup-tag || true
          gh release create fx-widget-latest fx-widget.apk \
            --title "원→달러 위젯 앱 (최신)" \
            --notes "안드로이드 휴대폰에서 fx-widget.apk 를 눌러 받은 뒤 설치하세요. 커밋: ${GITHUB_SHA::7}" \
            --target "$GITHUB_SHA"
